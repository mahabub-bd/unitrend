version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: unitrend-postgres
    environment:
      POSTGRES_DB: unitrend
      POSTGRES_USER: unitrend
      POSTGRES_PASSWORD: unitrend
    ports:
      - "5432:5432"
    volumes:
      - unitrend-postgres:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - unitrend-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unitrend-app
    ports:
      - "80:80"
    restart: unless-stopped
    networks:
      - unitrend-network
    environment:
      DATABASE_URL: postgresql://unitrend:unitrend@postgres:5432/unitrend
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-password}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-change-this-long-random-secret}
    depends_on:
      - postgres

  # Development service (optional - for hot reload during development)
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: unitrend-dev
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
    restart: unless-stopped
    networks:
      - unitrend-network
    profiles:
      - dev

networks:
  unitrend-network:
    driver: bridge

volumes:
  unitrend-postgres:
